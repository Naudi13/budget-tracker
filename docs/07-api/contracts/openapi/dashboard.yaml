openapi: 3.1.0
info:
  title: Budget Tracker API — dashboard
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Read-only KPIs and the five most recent transactions. Naming, versioning,
    status codes and the error shape follow ../../rest-conventions.md; shared
    components come from ./common.yaml.

servers:
  - url: https://{host}/api/v1
    description: The application, any environment
    variables:
      host:
        default: localhost:3000

security:
  - bearerAuth: []

paths:
  /dashboard:
    get:
      operationId: getDashboard
      summary: Read the dashboard
      description: >
        Implements HU-08. Totals are computed on read from transactions (BR-03), so
        a saved or deleted transaction is reflected immediately. Soft-deleted
        transactions are excluded (BR-04). Totals and recent transactions are the
        caller's for a USER and every account's for an ADMIN; the budget figures are
        the business's for everyone (BR-08). With categoryId, all of it is for that
        category. Implements HU-11.
      parameters:
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: KPIs and recent transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

components:
  schemas:
    Dashboard:
      type: object
      required: [totalIncome, totalExpenses, netBalance, recentTransactions]
      properties:
        totalIncome: { type: number }
        totalExpenses: { type: number }
        netBalance:
          type: number
          description: totalIncome minus totalExpenses (BR-03).
        budget:
          description: Null when no budget is in force today.
          oneOf:
            - $ref: '#/components/schemas/BudgetProgress'
            - type: 'null'
        recentTransactions:
          type: array
          maxItems: 5
          items:
            $ref: './transactions.yaml#/components/schemas/Transaction'

    BudgetProgress:
      type: object
      required: [amount, spent, available]
      properties:
        amount: { type: number, description: The budgets in force today. }
        spent: { type: number, description: Inside their periods, from every account (BR-08). }
        available: { type: number, description: amount minus spent; negative when over budget. }

  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
