openapi: 3.1.0
info:
  title: Budget Tracker API — shared components
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Error shape, pagination, parameters and the bearer security scheme that every
    resource contract in this folder references. Follows ../../rest-conventions.md.

servers:
  - url: https://{host}/api/v1
    description: The application, any environment
    variables:
      host:
        default: localhost:3000

paths: {}

components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          examples: [VALIDATION_ERROR]
        message:
          type: string
          examples: ['a transaction cannot mix income and expense details']
        details:
          type: array
          description: Present only on 400 and 422 responses.
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PaginationMeta:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }

  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid credentials were supplied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource, or its parent, does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with the resource's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: The request is well-formed but fails a business rule
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
