openapi: 3.1.0
info:
  title: Budget Tracker API — transactions
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Recording and reading income and expense transactions. Naming, versioning,
    status codes and the error shape follow ../../rest-conventions.md; shared
    components come from ./common.yaml.

servers:
  - url: https://{host}/api/v1
    description: The application, any environment
    variables:
      host:
        default: localhost:3000

security:
  - bearerAuth: []

paths:
  /transactions:
    get:
      operationId: listTransactions
      summary: List recorded transactions
      description: >
        Implements HU-05. Paginated history, newest first: a USER gets their own,
        an ADMIN gets every account's. Soft-deleted transactions are excluded
        (BR-04) unless an ADMIN asks for them with deleted=true, then only those.
      parameters:
        - $ref: './common.yaml#/components/parameters/PageParam'
        - $ref: './common.yaml#/components/parameters/LimitParam'
        - name: deleted
          in: query
          required: false
          description: ADMIN only; any other role gets 403.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: './common.yaml#/components/schemas/PaginationMeta'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'
    post:
      operationId: createTransaction
      summary: Record an income or expense transaction
      description: >
        Implements HU-04. A transaction carries one or more details; every detail
        must share one type, income or expense (BR-02).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransaction'
            examples:
              expense:
                value:
                  transactionDate: '2026-10-01'
                  description: Office supplies
                  details:
                    - subcategoryId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      amount: 85.5
      responses:
        '201':
          description: Transaction recorded
          headers:
            Location:
              description: URL of the new transaction
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '422':
          $ref: './common.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /transactions/{transactionId}/deletion:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      operationId: deleteTransaction
      summary: Delete a transaction, saying why
      description: >
        Implements HU-06. Soft delete: the transaction is hidden from listings and
        dashboard totals and is never removed from storage (BR-04). It is a POST
        because it carries a body. A USER can only delete their own; another's is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDeletion'
      responses:
        '204':
          description: Transaction hidden
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

components:
  parameters:
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Transaction:
      type: object
      required: [id, transactionDate, description, details]
      properties:
        id: { type: string, format: uuid }
        transactionDate: { type: string, format: date }
        description: { type: string }
        recordedBy:
          type: string
          description: The name of who recorded it; present only for an ADMIN.
        deletion:
          $ref: '#/components/schemas/DeletionRecord'
        details:
          type: array
          description: In the order the lines were entered.
          items:
            $ref: '#/components/schemas/TransactionDetail'

    TransactionDeletion:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }

    DeletionRecord:
      type: object
      description: Present only in the ADMIN's list of deleted transactions.
      required: [deletedAt, deletedBy, reason]
      properties:
        deletedAt: { type: string, format: date-time }
        deletedBy: { type: string, description: The name of who deleted it. }
        reason: { type: string }

    TransactionDetail:
      type: object
      required: [id, subcategoryId, amount, type]
      properties:
        id: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: At most two decimal places; stored as numeric(14,2), never as a float.
        type:
          type: string
          enum: [income, expense]
          readOnly: true
          description: Derived from the subcategory's category (BR-01); never sent by the client.

    NewTransaction:
      type: object
      required: [transactionDate, description, details]
      properties:
        transactionDate: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 200 }
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NewTransactionDetail'

    NewTransactionDetail:
      type: object
      required: [subcategoryId, amount]
      properties:
        subcategoryId: { type: string, format: uuid }
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: At most two decimal places; stored as numeric(14,2), never as a float.

  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
