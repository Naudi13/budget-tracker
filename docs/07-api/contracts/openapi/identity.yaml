openapi: 3.1.0
info:
  title: Budget Tracker API — identity
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Sign-up, sign-in and the administrator's account list. Sign-up and sign-in are the only
    write endpoints that accept an unauthenticated request (NFR-05). Naming,
    versioning, status codes and the error shape follow ../../rest-conventions.md;
    shared components come from ./common.yaml.

servers:
  - url: https://{host}/api/v1
    description: The application, any environment
    variables:
      host:
        default: localhost:3000

paths:
  /users:
    post:
      operationId: createUser
      summary: Sign up a business account
      description: >
        Implements HU-01. An email already in use is a conflict; the password is
        stored only as a salted hash (NFR-06). A new account always has the role USER;
        a role sent in the body is ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

    get:
      operationId: listUsers
      summary: List the accounts
      description: >
        Implements HU-09. Only the ADMIN role may call it (ADR-007). Ordered by email.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/PageParam'
        - $ref: './common.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /sessions:
    post:
      operationId: createSession
      summary: Sign in
      description: >
        Implements HU-01. Returns a bearer token that every other endpoint expects.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

components:
  schemas:
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    Role:
      type: string
      enum: [USER, ADMIN]

    UserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: './common.yaml#/components/schemas/PaginationMeta' }

    NewUser:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password:
          type: string
          writeOnly: true
          minLength: 8

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }

    Session:
      type: object
      required: [token, tokenType, expiresIn, role]
      properties:
        token: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn:
          type: integer
          description: Seconds until the token expires (AUTH_JWT_EXPIRY_SECONDS).
          examples: [3600]
        role: { $ref: '#/components/schemas/Role' }
