openapi: 3.1.0
info:
  title: Budget Tracker API — identity
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Sign-in, the accounts an administrator creates, and the single-use links that
    activate an account or reset its password. POST /sessions and
    POST /account-links/confirm are the only write endpoints that accept an
    unauthenticated request (NFR-05). Naming, versioning, status codes and the
    error shape follow ../../rest-conventions.md; shared components come from
    ./common.yaml.

servers:
  - url: https://{host}/api/v1
    description: The application, any environment
    variables:
      host:
        default: localhost:3000

paths:
  /users:
    post:
      operationId: createUser
      summary: Create an account
      description: >
        Implements HU-09, for the ADMIN role only (ADR-009). The account starts
        PENDING, with no password; the response carries the link that activates it
        (ADR-010). An email already in use is a conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

    get:
      operationId: listUsers
      summary: List the accounts
      description: >
        Implements HU-09. Only the ADMIN role may call it (ADR-007). Ordered by email.
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/PageParam'
        - $ref: './common.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUserStatus
      summary: Activate or inactivate an account
      description: >
        Implements HU-13, for the ADMIN role only (BR-09). Inactivating ends the
        account's sessions at once and cancels its unused links. An administrator
        cannot inactivate their own account: that is a conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'
    delete:
      operationId: deleteUser
      summary: Delete an account that was never activated
      description: >
        Implements HU-13, for the ADMIN role only (BR-09). An account that has a
        password is a conflict: inactivate it instead.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /users/{userId}/activation-links:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: createActivationLink
      summary: Generate a new activation link
      description: >
        Implements HU-09, for the ADMIN role only. Cancels any earlier link of the
        account. An account already active, or inactive, is a conflict.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Link generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLink'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /users/{userId}/password-resets:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: createPasswordReset
      summary: Generate a password reset link
      description: >
        Implements HU-10, for the ADMIN role only. The administrator never sees or
        sets a password. Cancels any earlier link of the account. An account still
        pending is a conflict: it needs an activation link.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Link generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLink'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /account-links/confirm:
    post:
      operationId: confirmAccountLink
      summary: Set the password with a link's token
      description: >
        Implements HU-10. A token that is unknown, expired or already used gets one
        and the same 400, on the field token, so a caller learns nothing about it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkConfirmation'
      responses:
        '204':
          description: Password set; the account is active
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

  /sessions:
    post:
      operationId: createSession
      summary: Sign in
      description: >
        Implements HU-01. Returns a bearer token that every other endpoint expects.
        An account still pending, or inactive, is refused like a wrong password.
        After 5 failed sign-ins with one email within 15 minutes, that email gets
        429 until the oldest of those failures is 15 minutes old (RNF-02).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: './common.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './common.yaml#/components/responses/InternalError'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [PENDING, ACTIVE, INACTIVE] }

    Role:
      type: string
      enum: [USER, ADMIN]

    UserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: './common.yaml#/components/schemas/PaginationMeta' }

    NewUser:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    UserStatusUpdate:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }

    AccountLink:
      type: object
      required: [token, expiresAt]
      description: Shown once. The portal builds the link; only a hash of the token is stored.
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    CreatedUser:
      type: object
      required: [user, activation]
      properties:
        user: { $ref: '#/components/schemas/User' }
        activation: { $ref: '#/components/schemas/AccountLink' }

    LinkConfirmation:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }

    Session:
      type: object
      required: [token, tokenType, expiresIn, role]
      properties:
        token: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn:
          type: integer
          description: Seconds until the token expires (AUTH_JWT_EXPIRY_SECONDS).
          examples: [3600]
        role: { $ref: '#/components/schemas/Role' }

  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
