# bud-tack-infra — the whole application on one machine.
#
#   browser ──► portal (nginx, the only published port) ──/api/, /health──► api ──► postgres
#                                                                    migrate ──┘ (DDL, then exits)
#
# One origin for the browser, no CORS (ADR-006). The API publishes no port: it
# is reachable only through the portal. PostgreSQL publishes 5432 on 127.0.0.1
# only, for `dotnet run` in bud-tack-db and bud-tack-api during development.
#
#   docker compose up -d --wait                          PostgreSQL only (local-setup.md, step 2)
#   docker compose --profile app up -d --build --wait    the whole application on :8080
name: bud-tack

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
      # Read by init/01-roles.sh on the first start only.
      BUD_TACK_MIGRATOR_PASSWORD: ${BUD_TACK_MIGRATOR_PASSWORD:?copy .env.example to .env}
      BUD_TACK_APP_PASSWORD: ${BUD_TACK_APP_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Applies bud-tack-db's pending migrations as bud_tack_migrator, then exits.
  # bud-tack-db ships no image (ADR-005: one console project), so this runs its
  # source with the .NET SDK. The source is mounted read-only and built in a
  # copy, so no bin/ or obj/ owned by root lands in your clone.
  migrate:
    profiles: [app]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /work
    command:
      - sh
      - -c
      - cp -r /source/. /work && dotnet run --project src/BudTack.Db.Migrations -- up
    environment:
      MIGRATOR_DATABASE_URL: postgresql://bud_tack_migrator:${BUD_TACK_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_dev}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ${DB_SOURCE:-../bud-tack-db}:/source:ro
      - nuget:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    image: bud-tack-api:${APP_TAG:-local}
    build: ${API_SOURCE:-../bud-tack-api}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bud_tack_app:${BUD_TACK_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app_dev}
    # No `ports:` — the portal is the only way in (ADR-006).
    healthcheck:
      # The aspnet image has no curl or wget: ask /health over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  portal:
    profiles: [app]
    image: bud-tack-portal:${APP_TAG:-local}
    build: ${PORTAL_SOURCE:-../bud-tack-portal}
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:3000
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    healthcheck:
      # Through nginx's own proxy: healthy means the whole chain answers.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  nuget:
