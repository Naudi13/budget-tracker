name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  local-postgres:
    name: Local PostgreSQL and roles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use the example environment
        run: cp .env.example .env

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Start PostgreSQL and wait until healthy
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify the migrator and app roles
        run: sh scripts/verify-roles.sh

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Stop and remove the stack
        if: always()
        run: docker compose down --volumes
